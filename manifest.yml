app-id: app.mixingstation.MixingStation
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: /app/bin/run.sh
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --env=PATH=/usr/bin:/app/bin:/app/jre/bin
  - --env=JAVA_HOME=/app/jre
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh

  - name: MixingStation
    buildsystem: simple
    build-commands:
      - unzip -d ${FLATPAK_DEST}/bin mixingstation.zip
      - install -Dm755 launcher.sh ${FLATPAK_DEST}/bin/run.sh
    sources:
      - type: file
        url: https://mixingstation.app/backend/api/web/download/update/mixing-station-pc/release
        sha256: 52795483379d60cf77e41ea6f0589c21ede25f109c2f4116bc7cee51954a3844
        dest-filename: mixingstation.zip
      - type: file
        path: launcher.sh
